<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Produção dos Maquinários — Heringer</title>
<!--
  ARQUIVO ÚNICO (HTML + CSS + JavaScript) — sem instalação, sem build.
  Basta abrir no navegador ou publicar via GitHub Pages.
  Toda a lógica se conecta direto ao banco de dados (Supabase) por API.
  Mapa rápido do arquivo:
    <style>  ...  CSS  (aparência: cores, layout, botões, cards)
    <body>   ...  só um <div id="root"> — tudo é desenhado via JavaScript
    <script> ...  toda a lógica (ver comentários dentro do <script>)
-->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================
   PALETA DE CORES E VARIAVEIS GLOBAIS
   Todas as cores do sistema ficam centralizadas aqui.
   Se quiser trocar a cor da marca, mexe só no --brand.
   ============================================================ */
:root {
  --brand:    #CA2535;
  --brand2:   #8B1A1E;
  --brand3:   #5C1114;
  --brand-bg: #FEF2F2;
  --brand-light: rgba(202,37,53,0.10);
  --bg:       #F2F1ED;
  --surface:  #FFFFFF;
  --surface2: #EDECEA;
  --surface3: #F7F6F4;
  --border:   rgba(0,0,0,0.07);
  --border2:  rgba(0,0,0,0.13);
  --text:     #18171A;
  --text2:    #0e0b05;
  --text3:    #161107;
  --blue-bg:#E6F1FB;--blue-text:#0C447C;
  --green-bg:#EAF4DC;--green-text:#285008;
  --amber-bg:#FDF0D5;--amber-text:#6B3C04;
  --red-bg:#FEF2F2;--red-text:#561515;
  --purple-bg:#EEEDFE;--purple-text:#3C3489;
  --teal-bg:#E1F5EE;--teal-text:#085041;
  --radius:10px; --radius-lg:14px;
}
/* ============================================================
   RESET BASICO + FONTE PADRAO DO SITE
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
code,.mono{font-family:'DM Mono',monospace;font-size:12px}
/* ============================================================
   TOPBAR (faixa vermelha do topo, com logo e nome do usuario)
   ============================================================ */
.shell{width:100%;padding:0 0 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg, var(--brand3) 0%, var(--brand2) 40%, var(--brand) 100%);padding:0 36px;min-height:82px;box-shadow:0 2px 16px rgba(90,16,18,0.28);position:sticky;top:0;z-index:100}
.logo-wrap{display:flex;align-items:center;gap:20px;min-width:0}
.logo-wrap img{flex-shrink:0}
.logo-text{min-width:0}
.logo-text .logo-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-text .logo-name{font-size:18px;font-weight:700;color:#fff;letter-spacing:-0.2px}
.logo-text .logo-sub{font-size:18px;color:rgba(255,255,255,0.60);margin-top:2px}
.topbar-user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;border:2px solid rgba(255,255,255,0.28)}
.uname{font-size:13px;font-weight:500;color:#fff}
.btn-logout{background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.22);border-radius:8px;padding:7px 14px;font-size:12px;font-family:inherit;cursor:pointer;color:#fff;display:flex;align-items:center;gap:6px;transition:background .15s}
.btn-logout:hover{background:rgba(255,255,255,0.20)}
/* ============================================================
   SIDEBAR LATERAL (menu fixo à esquerda, recolhível para so-icones)
   Layout geral: .app-shell = flex row (sidebar + conteudo)
   ============================================================ */
:root{
  --sidebar-w: 260px;
  --sidebar-w-collapsed: 76px;
  --sidebar-bg: #12182b;
  --sidebar-bg2: #1a2138;
  --sidebar-text: rgba(255,255,255,0.72);
  --sidebar-text-dim: rgba(255,255,255,0.42);
}
.app-shell{display:flex;min-height:100vh;width:100%}

.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--sidebar-bg);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  transition:width .18s ease;z-index:200;
}
.sidebar.collapsed{width:var(--sidebar-w-collapsed)}

.sidebar-head{padding:22px 16px 16px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar-logo-full{height:120px}
.sidebar-logo-mini{height:48px;display:none}
.sidebar-collapse-btn{background:none;border:none;color:var(--sidebar-text-dim);cursor:pointer;padding:6px;display:flex;flex-shrink:0;border-radius:6px;transition:background .15s,color .15s}
.sidebar-collapse-btn:hover{background:var(--sidebar-bg2);color:#fff}
.sidebar.collapsed .sidebar-logo-full{display:none}
.sidebar.collapsed .sidebar-logo-mini{display:block}
.sidebar.collapsed .sidebar-head{flex-direction:column;padding:22px 8px 16px;gap:14px}

.sidebar-session{
  padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:12px;
}
.sidebar-session-line{font-size:12px;color:var(--sidebar-text-dim);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar.collapsed .sidebar-session{display:none}

.sidebar-nav{display:flex;flex-direction:column;gap:3px;padding:0 12px;flex:1}
.sidebar-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:transparent;border:none;border-radius:10px;padding:11px 12px;
  font-family:inherit;font-size:13.5px;color:var(--sidebar-text);cursor:pointer;
  transition:background .15s,color .15s;white-space:nowrap;overflow:hidden;
}
.sidebar-item:hover{background:var(--sidebar-bg2);color:#fff}
.sidebar-item.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(202,37,53,0.35)}
.sidebar-item-icon{display:flex;flex-shrink:0}
.sidebar.collapsed .sidebar-item{justify-content:center;padding:11px 0}
.sidebar.collapsed .sidebar-item-label{display:none}

.sidebar-foot{
  display:flex;align-items:center;gap:10px;padding:16px 20px;
  border-top:1px solid rgba(255,255,255,0.08);margin-top:12px;
}
.sidebar-user-info{min-width:0;flex:1}
.sidebar-user-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-logout{background:none;border:none;color:var(--sidebar-text-dim);font-size:11.5px;font-family:inherit;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;margin-top:2px}
.sidebar-logout:hover{color:#fff}
.sidebar.collapsed .sidebar-foot{padding:16px 0;justify-content:center}
.sidebar.collapsed .sidebar-user-info{display:none}

.app-main{flex:1;min-width:0;display:flex;flex-direction:column}

.mobile-topbar{
  display:none;align-items:center;gap:14px;
  background:var(--sidebar-bg);padding:14px 18px;position:sticky;top:0;z-index:150;
}
.hamburger{background:none;border:none;color:#fff;cursor:pointer;padding:4px;display:flex}
.mobile-topbar-title{color:#fff;font-size:14px;font-weight:600}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:190}
.sidebar-overlay.visible{display:block}

@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,0.3)}
  .sidebar.mobile-open{transform:translateX(0);width:var(--sidebar-w)}
  .sidebar.mobile-open .sidebar-logo-full{display:block}
  .sidebar.mobile-open .sidebar-logo-mini{display:none}
  .sidebar.mobile-open .sidebar-session{display:block}
  .sidebar.mobile-open .sidebar-item{justify-content:flex-start;padding:11px 12px}
  .sidebar.mobile-open .sidebar-item-label{display:inline}
  .sidebar.mobile-open .sidebar-foot{padding:16px 20px;justify-content:flex-start}
  .sidebar.mobile-open .sidebar-user-info{display:block}
  .mobile-topbar{display:flex}
}
.content-wrap{padding:28px 32px}
/* ============================================================
   CARDS (caixas brancas usadas em toda a plataforma)
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 26px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.card-title{font-size:13px;font-weight:600;margin-bottom:18px;color:var(--text);display:flex;align-items:center;gap:8px}
/* Cartoes de metrica/numero grande (usados no Dashboard) */
.mcard{background:var(--surface2);border-radius:var(--radius);padding:18px 20px;border:1px solid var(--border)}
.mcard .lbl{font-size:10.5px;color:var(--text2);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em}
.mcard .val{font-size:28px;font-weight:700;letter-spacing:-0.5px}
.mcard .trend{font-size:11px;color:var(--text3);margin-top:5px}
.mcard-brand{background:linear-gradient(135deg,var(--brand2) 0%,var(--brand) 100%);color:white;border:none;box-shadow:0 4px 16px rgba(202,37,53,0.25)}
.mcard-brand .lbl,.mcard-brand .trend{color:rgba(255,255,255,0.70)}
.mcard-brand .val{color:white}
/* ============================================================
   GRIDS (colunas) E CAMPOS DE FORMULARIO
   ============================================================ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;color:var(--text2);margin-bottom:5px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:9px 12px;font-size:13px;font-family:inherit;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
textarea{height:64px;resize:vertical}
/* ============================================================
   BOTOES
   ============================================================ */
.btn-primary{background:var(--brand);color:white;border:none;border-radius:var(--radius);padding:11px 20px;font-size:13px;font-weight:600;cursor:pointer;width:100%;font-family:inherit;transition:background .15s,opacity .15s;box-shadow:0 2px 8px rgba(202,37,53,0.22)}
.btn-primary:hover{background:var(--brand2)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-sm{background:transparent;border:1px solid var(--border2);border-radius:8px;padding:6px 14px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--text);transition:background .15s}
.btn-sm:hover{background:var(--surface2)}
.btn-export{background:var(--brand);color:white;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:background .15s;box-shadow:0 2px 8px rgba(202,37,53,0.22)}
.btn-export:hover{background:var(--brand2)}
/* ============================================================
   BADGES (selinhos de status: Em producao / Produzido / Parada...)
   ============================================================ */
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:6px;letter-spacing:0.01em}
.b-normal{background:var(--blue-bg);color:var(--blue-text)}
.b-parada{background:var(--amber-bg);color:var(--amber-text)}
.b-sobra{background:var(--red-bg);color:var(--red-text)}
.b-ok{background:var(--green-bg);color:var(--green-text)}
/* ============================================================
   ALERTAS (avisos coloridos: erro, informacao, atencao)
   ============================================================ */
.alert{border-radius:var(--radius);padding:11px 16px;font-size:13px;margin-bottom:16px;display:flex;align-items:flex-start;gap:9px}
.alert-warn{background:var(--amber-bg);color:var(--amber-text)}
.alert-info{background:var(--blue-bg);color:var(--blue-text)}
.alert-err{background:var(--red-bg);color:var(--red-text)}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
/* ============================================================
   LINHAS DE LISTA (cada sequenciamento/ordem exibida numa lista)
   ============================================================ */
.row{padding:14px 0;border-bottom:1px solid var(--border);font-size:13px}
.row:last-child{border-bottom:none}
.row-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.row-sub{font-size:12px;color:var(--text2)}
.section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.09em;margin-bottom:14px}
.empty{text-align:center;padding:40px;font-size:13px;color:var(--text3)}
/* ============================================================
   TELA DE LOGIN (fundo com foto da fabrica + card branco central)
   ============================================================ */
.login-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--brand3) 0%,var(--brand2) 55%,var(--brand) 100%)}
.login-box{background:#fff;border-radius:20px;padding:44px 42px;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,0.32)}
.login-logo{text-align:center;margin-bottom:26px}
.login-logo h1{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px}
.login-logo p{font-size:13px;color:var(--text2)}
/* ============================================================
   SPINNER DE CARREGAMENTO (girando enquanto busca dados)
   ============================================================ */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px}
.spinner-dark{border-color:rgba(0,0,0,0.15);border-top-color:var(--brand)}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-spin{display:inline-flex;animation:spin 2.2s linear infinite;vertical-align:middle}
/* ============================================================
   RESPONSIVO (celular / tablet)
   ============================================================ */
@media(max-width:768px){
  .grid3,.grid4{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}

  .topbar{
    flex-wrap:wrap;
    padding:10px 16px;
    min-height:auto;
    gap:8px;
  }
  .logo-wrap img{height:60px}
  .logo-text .logo-name{font-size:14px}
  .logo-text .logo-sub{font-size:10.5px}
  .topbar-user{gap:8px}
  .uname{display:none} /* some com o nome no mobile pra economizar espaço */

  .nav-wrap{padding:0 12px}
  .tab{padding:11px 10px;font-size:11.5px;white-space:nowrap;flex-shrink:0}

  .content-wrap{padding:16px 12px}

  .login-box{padding:32px 22px;max-width:100%}
  .login-logo img{height:70px}

  .row-actions{flex-direction:column}
  .row-actions .btn-primary{width:100%}

  .card{padding:16px 16px}
}

@media(max-width:480px){
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .mcard .val{font-size:22px}
  .topbar-user .avatar{width:30px;height:30px}
  .btn-logout span{display:none} /* se quiser deixar só o ícone do botão sair */
}

/* ----------------------------------------------------------------
   FUNCOES DE ACESSO À API (substituem sbGet / sbPost direto ao Supabase)
   api()   -> qualquer método (GET, POST, PATCH, DELETE)
   apiGet  -> atalho GET
   apiPost -> atalho POST
   ---------------------------------------------------------------- */
async function api(method, path, body=null, isForm=false){
  let lastErr;
  const headers = {'Authorization': `Bearer ${_jwtToken}`};
  if(!isForm) headers['Content-Type'] = 'application/json';

  for(let i=0;i<3;i++){
    try{
      const opts = {method, headers};
      if(body){
        opts.body = isForm ? body : JSON.stringify(body);
      }
      const r = await fetch(`${API_URL}${path}`, opts);

      // Token expirado ou inválido — redireciona para login automaticamente
      if(r.status === 401){
        saveSession(null);
        session = null;
        _jwtToken = null;
        alert('Sua sessão expirou. Faça login novamente.');
        renderLogin();
        throw new Error('Token expirado');
      }

      if(!r.ok){
        const txt = await r.text();
        throw new Error(txt);
      }
      return await r.json();
    }catch(e){
      lastErr=e;
      // Não tenta retry em caso de token expirado
      if(e.message === 'Token expirado') throw e;
      if(i<2) await new Promise(r=>setTimeout(r,700*(i+1)));
    }
  }
  throw lastErr;
}
const apiGet  = (path)        => api('GET',   path);
const apiPost = (path, body)  => api('POST',  path, body);
const apiPatch= (path, body)  => api('PATCH', path, body);

/* Confere usuario/senha no banco e monta a sessao (maquina/turno/supervisor escolhidos) */
async function doLogin(){
  const usuario=document.getElementById('l-user').value.trim();
  const senha=document.getElementById('l-pass').value;
  const maquinaSel=document.getElementById('l-maquina');
  const supSel=document.getElementById('l-supervisor');
  if(!usuario||!senha){renderLogin('Preencha usuário e senha.');return}
  if(!maquinaSel.value){renderLogin('Selecione o maquinário.');return}
  if(!supSel.value){renderLogin('Selecione o supervisor responsável.');return}
  try{
    const resp = await fetch(`${API_URL}/api/login`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        usuario, senha,
        maquina_id:   maquinaSel.value,
        maquina_nome: maquinaSel.selectedOptions[0].dataset.nome,
        turno:        document.getElementById('l-turno').value,
        supervisor_id:   supSel.value,
        supervisor_nome: supSel.selectedOptions[0].dataset.nome,
      })
    });
    if(resp.status===401){renderLogin('Usuário ou senha incorretos.');return}
    if(!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    _jwtToken = data.token;
    session   = data.session;
    saveSession({token: _jwtToken, session});
    renderApp();
  }catch(e){renderLogin('Erro ao conectar: '+e.message)}
}

/* Recolhe/expande a sidebar (desktop: vira so icones; mobile: esconde/mostra) */
function toggleSidebar(){
  const el = document.getElementById('sidebar');
  el.classList.toggle('collapsed');
  el.classList.toggle('mobile-open');
  document.getElementById('sidebar-overlay').classList.toggle('visible');
  // Só salva a preferência de recolher/expandir para telas de desktop (no mobile é so abrir/fechar)
  if(window.innerWidth > 900){
    localStorage.setItem('sidebar_collapsed', el.classList.contains('collapsed') ? '1' : '0');
  }
}
/* Aplica a preferência salva de sidebar recolhida (chamado logo após montar a tela) */
function aplicarPreferenciaSidebar(){
  if(window.innerWidth > 900 && localStorage.getItem('sidebar_collapsed')==='1'){
    document.getElementById('sidebar')?.classList.add('collapsed');
  }
}

/* Troca de módulo (Registrar / SAP / Hoje / Dashboard / OEE / Relatorio) */
function switchTab(k,el){
  document.querySelectorAll('.sidebar-item').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  // No mobile, fecha a sidebar depois de escolher o modulo
  if(window.innerWidth <= 900){
    document.getElementById('sidebar')?.classList.remove('mobile-open');
    document.getElementById('sidebar-overlay')?.classList.remove('visible');
  }
  renderTab(k);
}
function renderTab(k){
  const c=document.getElementById('tab-content');
  const darkTabs=['dashboard','oee'];
  const wrap=document.querySelector('.content-wrap');
  if(wrap){
    if(darkTabs.includes(k)){
      wrap.style.padding='0';
      wrap.style.background='#0d0d1a';
      wrap.style.minHeight='100vh';
    } else {
      wrap.style.padding='';
      wrap.style.background='';
      wrap.style.minHeight='';
    }
  }
  const footer=document.getElementById('app-footer');
  if(footer) footer.style.display=darkTabs.includes(k)?'none':'';
  if(k==='form') renderForm(c);
  else if(k==='sap') renderSAP(c);
  else if(k==='hoje') renderHoje(c);
  else if(k==='dashboard') renderDashboard(c);
  else if(k==='oee') renderOEE(c);
  else if(k==='relatorio') renderRelatorio(c);
}
async function renderSAP(c){
  setLoading(c,'Carregando emissões SAP...');
  try{
    // Busca com retry automático (resolve o "Failed to fetch" intermitente)
    async function fetchComRetry(fn, tentativas=3){
      for(let i=0;i<tentativas;i++){
        try{ return await fn(); }
        catch(e){ if(i===tentativas-1) throw e; await new Promise(r=>setTimeout(r,800*(i+1))); }
      }
    }

    const rows = await apiGet('/api/sap');
    window._sapData = rows;
    renderSAPLista(c, rows, 'todos');

  }catch(e){
    c.innerHTML=`
      <div class="alert alert-err">${icons.err}<span>Erro ao carregar: ${e.message}</span></div>
      <button class="btn-primary" style="width:auto;margin-top:12px;" onclick="renderSAP(document.getElementById('tab-content'))">Tentar novamente</button>`;
  }
}

async function importarSAP(input){
  const file = input.files[0];
  if(!file) return;
  const msg = document.getElementById('sap-import-msg');
  msg.innerHTML = `<div class="alert alert-info">${icons.info}<span>Importando ${file.name}...</span></div>`;

  try{
    const formData = new FormData();
    formData.append('file', file);

    const r = await fetch(`${API_URL}/api/sap/importar`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${_jwtToken}` },
      body: formData
    });
    if(!r.ok) throw new Error(await r.text());
    const data = await r.json();

    msg.innerHTML = `<div class="alert alert-info">${icons.info}<span>✅ ${data.importados} registros importados para ${fmtDate(data.data)}.</span></div>`;

    msg.innerHTML = `<div class="alert alert-err">${icons.err}<span>Erro ao importar: ${e.message}</span></div>`;
  }

}

async function iniciarPreSeq(sapId, ordemProcesso, produto, tipoEmbalagem){
  const placa   = document.getElementById(`placa-preseq-${sapId}`)?.value.trim() || '';
  const ensaque = document.getElementById(`ensaque-preseq-${sapId}`)?.value || 'Ensaque 1';

  // Mapeia embalagem do SAP para o formato do sistema
  const embUpper = (tipoEmbalagem||'').toUpperCase();
  const embalagem = embUpper.includes('25') ? '25 KG'
                  : embUpper.includes('50') ? '50 KG'
                  : embUpper.includes('500') ? '500 KG'
                  : (embUpper.includes('1000')||embUpper.includes('BIG')) ? '1000 KG' : '';

  const payload = {
    data:           new Date().toISOString().split('T')[0],
    hora_inicio:    nowHM(),
    ordem_processo: ordemProcesso,
    produto:        produto,
    placa:          placa,
    ensaque:        ensaque,
    embalagem:      embalagem,
    status:         'em_producao',
    tipo_registro:  'producao',
  };

  try{
    await apiPost('/api/apontamentos', payload);
    // Remove da fila de pre-seq no SAP
    await apiPatch(`/api/sap/${sapId}/pre-seq`, { valor: false });
    // Recarrega a aba
    renderForm(document.getElementById('tab-content'));
    document.getElementById('save-msg') && (document.getElementById('save-msg').innerHTML=
      `<div class="alert alert-info">${icons.info}<span>Ordem <strong>${ordemProcesso}</strong> iniciada em produção!</span></div>`);
  }catch(e){ alert('Erro ao iniciar: '+e.message); }
}

async function renderAbertas(c){
  setLoading(c,'Carregando painel do turno...');
  try{
    const hoje=new Date().toISOString().split('T')[0];
    const [abertas, paradasHoje] = await Promise.all([
      apiGet(`/api/apontamentos?maquina_id=${session.maquina_id}&status=em_producao&order=hora_inicio.asc`),
      apiGet(`/api/apontamentos?maquina_id=${session.maquina_id}&data=${hoje}&order=hora_inicio.asc`),
    ]);

    const emProducao   = abertas.filter(r=>r.tipo_registro==='producao');
    const paradasAtivas= abertas.filter(r=>r.tipo_registro==='parada_geral'||r.tipo_registro==='parada_maquina');
    const historico    = paradasHoje.filter(r=>r.status==='parada'||r.status==='produzido');

    // Detecta lacunas de tempo não registradas, separadas por ensaque (Ensaque 1 / Ensaque 2).
    // Paradas gerais e de máquina (sem ensaque específico) valem para os dois lados.
    // Também considera o período desde o INÍCIO DO TURNO até o primeiro apontamento do dia.
    const turnoInicioMap = {'1':'07:00','2':'15:30','3':'23:30'};
    const turnoInicio = turnoInicioMap[session.turno] || '00:00';
    const agora = nowHM();

    function detectaLacunasPorEnsaque(recs){
      const lacunasPorLado = {};
      ['Ensaque 1','Ensaque 2'].forEach(lado=>{
        const doLado = recs.filter(r=>r.ensaque===lado || !r.ensaque);
        const sorted = [...doLado].sort((a,b)=>a.hora_inicio.localeCompare(b.hora_inicio));
        const lac=[];
        let cursor = turnoInicio;
        sorted.forEach(r=>{
          const hi=r.hora_inicio.slice(0,5), hf=r.hora_fim.slice(0,5);
          if(hi>cursor) lac.push({de:cursor, ate:hi});
          if(hf>cursor) cursor=hf;
        });
        if(agora>cursor) lac.push({de:cursor, ate:agora});
        lacunasPorLado[lado]=lac;
      });
      return lacunasPorLado;
    }
        // Inclui registros fechados + ordens em_producao abertas (usando agora como hora_fim temporária)
    const recsParaLacuna = [
      ...paradasHoje.filter(r=>r.hora_inicio&&r.hora_fim),
      ...emProducao.map(r=>({...r, hora_fim: agora+':00'}))
    ];
    const lacunasPorLado = detectaLacunasPorEnsaque(recsParaLacuna);

    // Junta lacunas com o mesmo horário nos dois ensaques numa única lacuna "dos dois lados"
    const lacunasCombinadas = [];
    const usadosE2 = new Set();
    (lacunasPorLado['Ensaque 1']||[]).forEach(l1=>{
      const idxE2 = (lacunasPorLado['Ensaque 2']||[]).findIndex((l2,i)=>!usadosE2.has(i)&&l2.de===l1.de&&l2.ate===l1.ate);
      if(idxE2>=0){ usadosE2.add(idxE2); lacunasCombinadas.push({de:l1.de,ate:l1.ate,lados:['Ensaque 1','Ensaque 2']}); }
      else lacunasCombinadas.push({de:l1.de,ate:l1.ate,lados:['Ensaque 1']});
    });
    (lacunasPorLado['Ensaque 2']||[]).forEach((l2,i)=>{
      if(!usadosE2.has(i)) lacunasCombinadas.push({de:l2.de,ate:l2.ate,lados:['Ensaque 2']});
    });
    lacunasCombinadas.sort((a,b)=>a.de.localeCompare(b.de));
    const lacunas = lacunasCombinadas;

    c.innerHTML=`
      <!-- PRODUÇÕES EM ANDAMENTO -->
      <div class="card" style="border-left:4px solid var(--green-text);">
        <div class="card-title">
          <span style="color:var(--green-text);display:inline-flex;">${icons.gear}</span> Ordens em produção
          <span class="badge b-ok" style="margin-left:8px;">${emProducao.length}</span>
        </div>
        ${!emProducao.length?`<div class="empty">Nenhuma ordem em produção. Registre uma ordem ou abra uma parada de máquina.</div>`:
        emProducao.map(r=>`
          <div class="row" id="row-${r.id}" style="border-left:3px solid var(--green-text);padding-left:10px;">
            <div class="row-head">
              <strong>${r.ordem_processo||'-'}</strong>
              <span class="badge b-ok" style="display:inline-flex;align-items:center;gap:4px;">${icons.gear} Em produção</span>
              <span style="font-size:11px;color:var(--text3);">desde ${(r.hora_inicio||'').slice(0,5)}</span>
            </div>

/* Confirma a parada: fecha a ordem atual e cria parada de máquina */
async function confirmarParadaOrdem(idOrdem){
  const hi   = document.getElementById('rp-hi-'+idOrdem)?.value;
  const mot  = document.getElementById('rp-mot-'+idOrdem)?.value;
  const obs  = document.getElementById('rp-obs-'+idOrdem)?.value.trim();
  if(!mot){alert('Selecione o motivo de parada.');return}

  try{
    // 1. Fecha a ordem em produção com hora_fim = hora início da parada
    await apiPatch(`/api/apontamentos/${idOrdem}`, {
      hora_fim: hi,
      status: 'parada',
      cod_parada: mot,
      motivo_parada: mot,
      classe_parada: PLANEJADAS.includes(mot)?'Planejada':'Não planejada',
      observacao: obs||undefined
    });

    // 2. Cria registro de parada da máquina
    await apiPost('/api/apontamentos', {
      data:          new Date().toISOString().split('T')[0],
      hora_inicio:   hi,
      cod_parada:    mot,
      motivo_parada: mot,
      classe_parada: PLANEJADAS.includes(mot)?'Planejada':'Não planejada',
      observacao:    obs||'',
      status:        'em_producao',
      tipo_registro: 'parada_maquina',
      retomada_de:   idOrdem,
    });

    renderAbertas(document.getElementById('abertas-wrap'));
  }catch(e){alert('Erro ao registrar parada: '+e.message)}
}

async function confirmarLacuna(hi, hf, btnEl){
  const mot = document.getElementById('lac-mot')?.value;
  const obs = document.getElementById('lac-obs')?.value.trim();
  const ladosSelecionados = Array.from(document.querySelectorAll('.lac-lado-chk'))
    .filter(el=>el.type!=='checkbox' || el.checked)
    .map(el=>el.value);
  if(!mot){alert('Selecione o motivo.');return}
  if(!ladosSelecionados.length){alert('Selecione ao menos um ensaque para justificar.');return}

  // Trava o botão imediatamente para não deixar clicar duas vezes
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'Salvando...'; }

  try{
    const hoje = new Date().toISOString().split('T')[0];

    // Confere quais lados já foram justificados antes (evita duplicar)
    const existentes = await apiGet(
      `/api/apontamentos?maquina_id=${session.maquina_id}&data=${hoje}&tipo_registro=parada_maquina`
    );

    for(const lado of ladosSelecionados){
      const jaJustificada = existentes.some(r =>
        (r.hora_inicio||'').slice(0,5) === hi && (r.hora_fim||'').slice(0,5) === hf && r.ensaque === lado
      );
      if(!jaJustificada){
        await apiPost('/api/apontamentos',{
          data:          hoje,
          hora_inicio:   hi,
          hora_fim:      hf,
          ensaque:       lado,
          cod_parada:    mot,
          motivo_parada: mot,
          classe_parada: PLANEJADAS.includes(mot)?'Planejada':'Não planejada',
          observacao:    obs||'',
          status:        'parada',
          tipo_registro: 'parada_maquina',
        });
      }
    }

    document.getElementById('lacuna-box')?.remove();
    renderAbertas(document.getElementById('abertas-wrap'));
  }catch(e){
    alert('Erro: '+e.message);
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = 'Confirmar'; }
  }
}

/* Cria um NOVO registro em producao pra mesma ordem/produto/placa/ensaque
   de uma ordem que estava parada — assim a ordem 'continua' depois do reparo */
async function retomarProducao(idOrigem){
  try{
    const origem = await apiGet(`/api/apontamentos/${idOrigem}`);
    // Marca a parada original como "retomada" para sair da lista
    await apiPatch(`/api/apontamentos/${idOrigem}`, { retomada: true });
    // Cria novo registro em produção
    await apiPost('/api/apontamentos', {
      data: new Date().toISOString().split('T')[0],
      hora_inicio: nowHM(),
      ordem_processo: origem.ordem_processo,
      produto: origem.produto,
      placa: origem.placa,
      ensaque: origem.ensaque,
      status: 'em_producao',
      tipo_registro: 'producao',
      retomada_de: idOrigem,
    });
    renderAbertas(document.getElementById('abertas-wrap'));
  }catch(e){alert('Erro ao retomar: '+e.message)}
}

/* Confirma o fechamento da ordem: grava status='produzido' ou status='parada' */
async function fecharOrdem(id,tipo){
  const hora_fim=document.getElementById('cf-hf-'+id).value;
  if(!hora_fim){alert('Informe a hora fim.');return}
  const patch={hora_fim,status:tipo};
  if(tipo==='produzido'){
    const vol=document.getElementById('cf-vol-'+id).value;
    patch.volume_produzido=vol?parseFloat(vol):null;
    const rej=document.getElementById('cf-rej-'+id).value;
    patch.rejeito_ton=rej?parseFloat(rej):0;
    patch.rejeito=rej?rej+'t':'0';
    const obs=document.getElementById('cf-obs-'+id)?.value.trim();
    if(obs) patch.observacao=obs;
  } else {
    const cod=document.getElementById('cf-cod-'+id).value;
    if(!cod){alert('Selecione o motivo de parada.');return}
    patch.cod_parada=cod;
    patch.motivo_parada=cod;
    // Classifica automaticamente (planejada ou não) com base no motivo
    const planejadas=['Sobreposição Turno','Limpeza Semanal','Linha Não Programada para Operar',
      'Manutenção Preventiva','Parada de Manutenção Anual','Refeição','DDS','Reuniões e Treinamentos'];
    patch.classe_parada = planejadas.includes(cod) ? 'Planejada' : 'Não planejada';
    const obs=document.getElementById('cf-obs-'+id).value.trim();
    if(obs) patch.observacao=obs;
  }
  try{
    await apiPatch(`/api/apontamentos/${id}`, patch);
    renderAbertas(document.getElementById('abertas-wrap'));
  }catch(e){alert('Erro ao atualizar: '+e.message)}
}

/* ================================================================
   ABA 2 — SEQUENCIAMENTOS DE HOJE
   Lista tudo que foi feito hoje na maquina do usuario logado.
   ================================================================ */
async function renderHoje(c){
  setLoading(c);
  try{
    const hoje=new Date().toISOString().split('T')[0];
    // Pega ordens do dia OU ordens de ontem ainda em aberto (sem hora_fim)
    const [rowsHoje, rowsOntem] = await Promise.all([
      apiGet(`/api/apontamentos?maquina_id=${session.maquina_id}&data=${hoje}&order=hora_inicio.desc`),
      apiGet(`/api/apontamentos?maquina_id=${session.maquina_id}&data_lt=${hoje}&status=em_producao&order=hora_inicio.desc`),
    ]);
    // Junta, removendo duplicatas por id
    const ids = new Set(rowsHoje.map(r=>r.id));
    const rows = [...rowsHoje, ...rowsOntem.filter(r=>!ids.has(r.id))];

    c.innerHTML=`
      <p class="section-title">Sequenciamentos de hoje — ${session.maquina_nome} (${rows.length})</p>
      <div class="card" style="padding:4px 22px;">
        ${!rows.length?'<div class="empty">Nenhum sequenciamento ainda hoje.</div>':
        rows.map(r=>`<div class="row">
          <div class="row-head">
            <strong>${r.ordem_processo}</strong>
            ${statusBadge(r)}
            ${r.data!==hoje?`<span class="badge b-parada" title="Iniciado em ${fmtDate(r.data)}">Dia anterior</span>`:''}
            <span style="font-size:11px;color:var(--text3);">${(r.hora_inicio||'').slice(0,5)} – ${(r.hora_fim||'').slice(0,5)||'em aberto'}</span>
          </div>
          <div class="row-sub">${r.produto||'-'} · Placa ${r.placa||'-'}${r.ensaque?' · '+r.ensaque:''} · Volume: ${r.volume_produzido??'-'} · Rejeito: ${r.rejeito||'-'}</div>
          ${r.observacao?`<div class="row-sub">Obs: ${r.observacao}</div>`:''}
        </div>`).join('')}
      </div>`;
  }catch(e){c.innerHTML=`<div class="alert alert-err">${icons.err}<span>Erro: ${e.message}</span></div>`}
}

/* ================================================================
   ABA 3 — DASHBOARD
   Numeros gerais do dia (todas as maquinas): volume produzido,
   quantas ordens em producao agora, quantas paradas, etc.
   ================================================================ */
async function renderDashboard(c, filtroMaquinaId, filtroData){
  setLoading(c,'Carregando dashboard...');
  try{
    const hoje = new Date().toISOString().split('T')[0];
    const dataAlvo = filtroData || hoje;
    const maquinaAlvo = session.master ? (filtroMaquinaId||'') : session.maquina_id;
    const params = maquinaAlvo
      ? `/api/apontamentos?data=${dataAlvo}&maquina_id=${maquinaAlvo}&order=hora_inicio.asc`
      : `/api/apontamentos?data=${dataAlvo}&order=hora_inicio.asc`;
    const rows = await apiGet(params);

    const PADRAO_TH = 18.8;
    const PLANEJADAS_DASH = ['Sobreposição Turno','Limpeza Semanal','Linha Não Programada para Operar',
      'Manutenção Preventiva','Parada de Manutenção Anual','Refeição','DDS','Reuniões e Treinamentos'];

    function calcDurH(hi,hf){
      if(!hi||!hf) return 0;
      const [hh,mm]=hi.split(':').map(Number),[eh,em]=hf.split(':').map(Number);
      let d=(eh*60+em)-(hh*60+mm); if(d<0)d+=1440; return d/60;
    }

    // Métricas gerais
    const prodRows  = rows.filter(r=>r.status==='produzido'&&r.tipo_registro==='producao'&&r.hora_fim);
    const paradRows = rows.filter(r=>r.status==='parada'&&r.hora_fim);
    const emProd    = rows.filter(r=>r.status==='em_producao').length;
    const volTotal  = prodRows.reduce((s,r)=>s+(parseFloat(r.volume_produzido)||0),0);
    const volRejeito= rows.reduce((s,r)=>s+(r.rejeito_ton||0),0);
    const hProd     = prodRows.reduce((s,r)=>s+calcDurH(r.hora_inicio,r.hora_fim),0);
    const hParada   = paradRows.reduce((s,r)=>s+calcDurH(r.hora_inicio,r.hora_fim),0);
    const hTurno    = 8.6; // referência padrão
    const volMeta   = hTurno * PADRAO_TH;

    // OEE global
    const disp = hTurno>0 ? Math.min(hProd/hTurno*100,100) : 0;
    const perf = hProd>0  ? Math.min(volTotal/(hProd*PADRAO_TH)*100,100) : 0;
    const qual = volTotal>0 ? (volTotal-volRejeito)/volTotal*100 : 100;
    const oee  = disp*perf*qual/10000;
    const oeeColor = oee>=85?'#22c55e':oee>=65?'#f59e0b':'#ef4444';
    const oeeLabel = oee>=85?'Excelente':oee>=65?'Aceitável':'Crítico';

    // Gauge semicircular SVG
    function semiGauge(val, color, label){
      const R=54, cx=70, cy=70;
      const startA=-180, endA=0;
      const toRad=a=>a*Math.PI/180;
      const pct=Math.min(val/100,1);
      const angle=-180+pct*180;
      const x=cx+R*Math.cos(toRad(angle)), y=cy+R*Math.sin(toRad(angle));
      const bg_x2=cx+R*Math.cos(toRad(0)), bg_y2=cy+R*Math.sin(toRad(0));
      return `<svg width="140" height="80" viewBox="0 0 140 80">
        <path d="M${cx-R},${cy} A${R},${R} 0 0,1 ${bg_x2},${bg_y2}" fill="none" stroke="#2a2a3a" stroke-width="10" stroke-linecap="round"/>
        <path d="M${cx-R},${cy} A${R},${R} 0 0,1 ${x},${y}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"/>
        <text x="70" y="62" text-anchor="middle" font-size="18" font-weight="800" fill="${color}">${val.toFixed(1)}%</text>
        <text x="70" y="75" text-anchor="middle" font-size="9" fill="#888">${label}</text>
      </svg>`;
    }

    // Mini gauge circular
    function miniGauge(val, color, label, sub){
      const r=28, circ=2*Math.PI*r, offset=circ*(1-Math.min(val/100,1));
      return `<div style="text-align:center;">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle cx="36" cy="36" r="${r}" fill="none" stroke="#2a2a3a" stroke-width="8"/>
          <circle cx="36" cy="36" r="${r}" fill="none" stroke="${color}" stroke-width="8"
            stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
            stroke-linecap="round" transform="rotate(-90 36 36)"/>
          <text x="36" y="40" text-anchor="middle" font-size="11" font-weight="800" fill="${color}">${val.toFixed(1)}%</text>
        </svg>
        <div style="font-size:11px;font-weight:600;color:#ccc;margin-top:2px;">${label}</div>
        <div style="font-size:10px;color:#666;">${sub}</div>
      </div>`;
    }

    // Tendência por hora (sparkline)
    function sparkline(recs){
      const horas = Array.from({length:24},(_,i)=>i);
      const data = horas.map(h=>{
        const hr = recs.filter(r=>r.hora_inicio&&parseInt(r.hora_inicio)===h&&r.status==='produzido');
        return hr.reduce((s,r)=>s+(r.volume_produzido||0),0);
      });
      const max = Math.max(...data,0.1);
      const pts = data.map((v,i)=>`${(i/23*380).toFixed(1)},${(60-v/max*55).toFixed(1)}`).join(' ');
      const filled = data.map((v,i)=>`${(i/23*380).toFixed(1)},${(60-v/max*55).toFixed(1)}`).join(' ') + ` 380,60 0,60`;
      return `<svg width="100%" viewBox="0 0 380 65" preserveAspectRatio="none" style="display:block;">
        <defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>
        <polygon points="${filled}" fill="url(#sg)"/>
        <polyline points="${pts}" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="${(60-85/100*55).toFixed(1)}" x2="380" y2="${(60-85/100*55).toFixed(1)}" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
      </svg>`;
    }

    // Pareto de paradas
    const paradaMap={};
    paradRows.forEach(r=>{
      const m=r.cod_parada||'Sem motivo';
      paradaMap[m]=(paradaMap[m]||0)+calcDurH(r.hora_inicio,r.hora_fim);
    });
    const topParadas=Object.entries(paradaMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const totalParadaH=topParadas.reduce((s,[,h])=>s+h,0);

    // Turnos
    const turnos={};
    rows.forEach(r=>{
      const t=r.turno||'Sem turno';
      if(!turnos[t]) turnos[t]={nome:t,prod:[],parada:[]};

    // Filtros
    const filtroHtml = session.master ? `
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;">

    </style>
    <div class="dash-dark" id="dash-container">
      ${filtroHtml}

      <!-- LINHA 1: OEE Global + 3 componentes -->
      <div class="dash-grid dash-grid-2" style="margin-bottom:12px;">
        <div class="dash-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">

          ${semiGauge(oee, oeeColor, oeeLabel)}
          <div style="width:100%;margin-top:12px;">
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span style="color:#888;">Disponibilidade</span><span style="color:#3b82f6;font-weight:700;">${disp.toFixed(1)}%</span></div>
            <div style="height:5px;background:#1e1e3a;border-radius:3px;margin-bottom:8px;"><div style="width:${disp.toFixed(1)}%;height:100%;background:#3b82f6;border-radius:3px;"></div></div>
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span style="color:#888;">Performance</span><span style="color:#a855f7;font-weight:700;">${perf.toFixed(1)}%</span></div>

              <div style="font-size:11px;color:#555;margin-bottom:4px;">Meta ${volMeta.toFixed(1)} t (${volMeta>0?(volTotal/volMeta*100).toFixed(0):0}%)</div>
              <div style="height:6px;background:#1e1e3a;border-radius:3px;"><div style="width:${Math.min(volTotal/volMeta*100,100).toFixed(1)}%;height:100%;background:#f59e0b;border-radius:3px;"></div></div>

          <div style="display:flex;gap:16px;margin-top:8px;font-size:10px;color:#555;">

/* ================================================================
   ABA OEE — EFICIÊNCIA GLOBAL DOS EQUIPAMENTOS
   ================================================================ */
async function renderOEE(c){
  setLoading(c,'Calculando OEE...');
  try{
    const hoje = new Date().toISOString().split('T')[0];
    const filtro = session.master
      ? `/api/apontamentos?data=${hoje}&order=maquina_nome.asc,turno.asc`
      : `/api/apontamentos?maquina_id=${session.maquina_id}&data=${hoje}&order=turno.asc`;
    const rows = await apiGet(filtro);

    const PADRAO_TH = 18.8;
    const PL = ['Sobreposição Turno','Limpeza Semanal','Linha Não Programada para Operar',
      'Manutenção Preventiva','Parada de Manutenção Anual','Refeição','DDS','Reuniões e Treinamentos'];

    function calcDurH(hi,hf){
      if(!hi||!hf) return 0;
      const [hh,mm]=hi.split(':').map(Number),[eh,em]=hf.split(':').map(Number);
      let d=(eh*60+em)-(hh*60+mm); if(d<0)d+=1440; return d/60;
    }

    // Agrupa por máquina+turno
    const grupos={};
    rows.forEach(r=>{
      const key=`${r.maquina_id}__${r.turno||'Sem turno'}`;
      if(!grupos[key]) grupos[key]={maquina_nome:r.maquina_nome,turno:r.turno||'Sem turno',registros:[]};
      grupos[key].registros.push(r);
    });

    const horasTurno={'1ºT - 07:00/16:48':8.6,'2ºT - 15:30/00:54':8.1,'3ºT - 23:30/08:12':7.3,'Adm - 07:00/16:48':9.8};

    function barGauge(val,color,label){
      return `<div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;">
          <span style="color:#888;">${label}</span>
          <span style="color:${color};font-weight:700;">${val.toFixed(1)}%</span>
        </div>
        <div style="height:7px;background:#1e1e3a;border-radius:4px;overflow:hidden;">
          <div style="width:${Math.min(val,100).toFixed(1)}%;height:100%;background:${color};border-radius:4px;"></div>
        </div>
      </div>`;
    }

    function oeeCard(key){
      const g=grupos[key],recs=g.registros,hTurno=horasTurno[g.turno]||8;
      const prodF=recs.filter(r=>r.status==='produzido'&&r.tipo_registro==='producao'&&r.hora_fim);
      const hProd=prodF.reduce((s,r)=>s+calcDurH(r.hora_inicio,r.hora_fim),0);
      const volTotal=prodF.reduce((s,r)=>s+(r.volume_produzido||0),0);
      const volRejeito=recs.reduce((s,r)=>s+(r.rejeito_ton||0),0);
      const paradaF=recs.filter(r=>r.status==='parada'&&r.hora_fim);
      const hParNP=paradaF.filter(r=>!PL.includes(r.cod_parada)).reduce((s,r)=>s+calcDurH(r.hora_inicio,r.hora_fim),0);
      const hParP=paradaF.filter(r=>PL.includes(r.cod_parada)).reduce((s,r)=>s+calcDurH(r.hora_inicio,r.hora_fim),0);
      const disp=hTurno>0?Math.min(hProd/hTurno*100,100):0;
      const perf=hProd>0?Math.min(volTotal/(hProd*PADRAO_TH)*100,100):0;
      const qual=volTotal>0?(volTotal-volRejeito)/volTotal*100:100;
      const oee=disp*perf*qual/10000;
      const oeeColor=oee>=85?'#22c55e':oee>=65?'#f59e0b':'#ef4444';
      const oeeLabel=oee>=85?'Excelente':oee>=65?'Aceitável':'Crítico';

      const paradaMap={};
      paradaF.forEach(r=>{ const m=r.cod_parada||'Sem motivo'; paradaMap[m]=(paradaMap[m]||0)+calcDurH(r.hora_inicio,r.hora_fim); });
      const topP=Object.entries(paradaMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
      const totP=topP.reduce((s,[,h])=>s+h,0);

      // Sparkline por hora
      const hData=Array.from({length:24},(_,i)=>{
        const hr=prodF.filter(r=>r.hora_inicio&&parseInt(r.hora_inicio)===i);
        return hr.reduce((s,r)=>s+(r.volume_produzido||0),0);
      });
      const maxH=Math.max(...hData,0.1);
      const pts=hData.map((v,i)=>`${(i/23*280).toFixed(1)},${(40-v/maxH*36).toFixed(1)}`).join(' ');

      return `<div style="background:#12122a;border:1px solid #1e1e3a;border-radius:12px;padding:16px;margin-bottom:12px;">
        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
          <div>
            <div style="font-size:15px;font-weight:700;color:#e0e0e0;">${g.maquina_nome}</div>
            <div style="font-size:11px;color:#555;">${g.turno} · ${hoje}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:32px;font-weight:900;color:${oeeColor};line-height:1;">${oee.toFixed(1)}%</div>
            <div style="font-size:11px;color:${oeeColor};">${oeeLabel}</div>
          </div>
        </div>

        <!-- Barras OEE -->
        <div style="margin-bottom:16px;">
          ${barGauge(disp,'#3b82f6','Disponibilidade')}
          ${barGauge(perf,'#a855f7','Performance')}
          ${barGauge(qual,'#22c55e','Qualidade')}
        </div>

        <!-- Métricas -->
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;">
          <div style="background:#0d0d1a;border-radius:8px;padding:10px;text-align:center;">
            <div style="font-size:16px;font-weight:700;color:#3b82f6;">${hProd.toFixed(1)}h</div>
            <div style="font-size:9px;color:#555;text-transform:uppercase;">Horas prod.</div>
          </div>
          <div style="background:#0d0d1a;border-radius:8px;padding:10px;text-align:center;">
            <div style="font-size:16px;font-weight:700;color:#f59e0b;">${volTotal.toFixed(2)}t</div>
            <div style="font-size:9px;color:#555;text-transform:uppercase;">Volume</div>
          </div>
          <div style="background:#0d0d1a;border-radius:8px;padding:10px;text-align:center;">
            <div style="font-size:16px;font-weight:700;color:#ef4444;">${(hParNP*60).toFixed(0)}min</div>
            <div style="font-size:9px;color:#555;text-transform:uppercase;">Paradas NP</div>
          </div>
          <div style="background:#0d0d1a;border-radius:8px;padding:10px;text-align:center;">
            <div style="font-size:16px;font-weight:700;color:#374151;">${(hParP*60).toFixed(0)}min</div>
            <div style="font-size:9px;color:#555;text-transform:uppercase;">Paradas Plan.</div>
          </div>
        </div>

        <!-- Sparkline + Pareto -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <div style="font-size:10px;color:#555;text-transform:uppercase;margin-bottom:6px;">Tendência por hora</div>
            <svg width="100%" viewBox="0 0 280 44" preserveAspectRatio="none" style="display:block;height:44px;">
              <polyline points="${pts}" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <div style="font-size:10px;color:#555;text-transform:uppercase;margin-bottom:6px;">Pareto de paradas</div>
            ${!topP.length?'<div style="color:#555;font-size:11px;">Sem paradas</div>':
            topP.map(([mot,h])=>`
              <div style="margin-bottom:5px;">
                <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px;">
                  <span style="color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75%;">${mot}</span>
                  <span style="color:${PL.includes(mot)?'#555':'#ef4444'};font-weight:600;">${(h*60).toFixed(0)}m</span>
                </div>
                <div style="height:4px;background:#1e1e3a;border-radius:2px;">
                  <div style="width:${totP>0?(h/totP*100).toFixed(1):0}%;height:100%;background:${PL.includes(mot)?'#374151':'#ef4444'};border-radius:2px;"></div>
                </div>
              </div>`).join('')}
          </div>
        </div>
      </div>`;
    }

    const cards=Object.keys(grupos).map(oeeCard).join('');
    c.innerHTML=`
    <div style="background:#0d0d1a;min-height:100vh;padding:20px 24px;box-sizing:border-box;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
        <div>
          <div style="font-size:15px;font-weight:700;color:#e0e0e0;">⚡ OEE — ${session.master?'Todos os maquinários':session.maquina_nome}</div>
          <div style="font-size:11px;color:#555;">Eficiência Global dos Equipamentos · ${hoje}</div>
        </div>
        <div style="display:flex;gap:8px;">
          <div style="background:#12122a;border:1px solid #1e1e3a;border-radius:8px;padding:8px 14px;font-size:11px;color:#888;">
            📊 Padrão: <strong style="color:#ccc;">${PADRAO_TH} t/h</strong> · Meta: <strong style="color:#22c55e;">≥ 85%</strong>
          </div>
          <button onclick="renderOEE(document.getElementById('tab-content'))"
            style="padding:8px 14px;background:#1e1e3a;border:1px solid #333;border-radius:8px;color:#888;font-size:12px;cursor:pointer;">🔄</button>
        </div>
      </div>
      ${!Object.keys(grupos).length?
        '<div style="text-align:center;padding:40px;color:#555;">Nenhum apontamento registrado hoje para calcular OEE.</div>':cards}
    </div>`;
  }catch(e){c.innerHTML=`<div style="color:#ef4444;padding:20px;">Erro: ${e.message}</div>`}
}


/* ================================================================
   ABA 4 — RELATORIO
   Lista TODOS os sequenciamentos ja registrados (nao so hoje) e
   permite exportar tudo pra Excel.
   ================================================================ */
async function renderRelatorio(c){
  setLoading(c);
  try{
    const hoje=new Date().toISOString().split('T')[0];
    // master vê tudo (qualquer data); operador comum só vê/exporta o dia de hoje, na própria máquina
    const params = session.master
      ? `/api/apontamentos?order=data.desc,hora_inicio.desc`
      : `/api/apontamentos?maquina_id=${session.maquina_id}&data=${hoje}&order=hora_inicio.desc`;

    const rows=await apiGet(params);
    window._relatorioData=rows;

    const titulo = session.master
      ? `Relatório consolidado — todos os maquinários (${rows.length})`
      : `Relatório — ${session.maquina_nome} · hoje (${fmtDate(hoje)}) (${rows.length})`;

    c.innerHTML=`
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
        <button class="btn-export" onclick="exportExcel()">${icons.dl} Exportar Excel</button>
      </div>
      <div class="card" style="padding:4px 22px;">
        <p class="section-title" style="margin-top:10px;">${titulo}</p>
        ${!rows.length?'<div class="empty">Nenhum sequenciamento registrado ainda.</div>':
        rows.map(r=>`<div class="row">
          <div class="row-head"><strong>${r.ordem_processo||'Parada geral'}</strong>${statusBadge(r)}<span style="font-size:11px;color:var(--text3);">${fmtDate(r.data)} · ${(r.hora_inicio||'').slice(0,5)}–${(r.hora_fim||'').slice(0,5)||'aberto'} (${fmtDuracao(calcularDuracaoMin(r.data,r.hora_inicio,r.hora_fim))||'-'})</span></div>
          <div class="row-sub">${r.produto||'-'}${r.ensaque?' · '+r.ensaque:''}${r.embalagem?' · '+r.embalagem:''} · Volume: ${r.volume_produzido??'-'} · Rejeito: ${r.rejeito||'-'}</div>
          <div class="row-sub">Operador: ${r.operador_nome||'-'} · Supervisor: ${r.supervisor_nome||'-'} · ${r.maquina_nome||'-'}</div>
        </div>`).join('')}
      </div>`;
  }catch(e){c.innerHTML=`<div class="alert alert-err">${icons.err}<span>Erro: ${e.message}</span></div>`}
}

/* ----------------------------------------------------------------
   CALCULO DE DURACAO (usado no relatorio e na exportacao Excel)
   Pega hora inicio e hora fim do mesmo dia e devolve os minutos
   corridos entre os dois horarios.
   ---------------------------------------------------------------- */
function calcularDuracaoMin(data, horaInicio, horaFim){
  if(!data || !horaInicio || !horaFim) return null;
  const hi = horaInicio.length===5 ? horaInicio+':00' : horaInicio;
  const hf = horaFim.length===5 ? horaFim+':00' : horaFim;
  const ini = new Date(`${data}T${hi}`);
  const fim = new Date(`${data}T${hf}`);
  let diffMin = (fim - ini) / 60000;
  if(diffMin < 0) diffMin += 24*60; // virou o dia
  return diffMin;
}
function fmtDuracao(min){
  if(min===null || isNaN(min)) return '';
  const h = Math.floor(min/60);
  const m = Math.round(min%60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

/* ----------------------------------------------------------------
   EXPORTACAO PARA EXCEL
   Monta uma planilha com todos os sequenciamentos do relatorio,
   incluindo operador, supervisor, maquina, ensaque e duracao.
   ---------------------------------------------------------------- */
function exportExcel(){
  const rows = window._relatorioData || [];
  const wb = XLSX.utils.book_new();
  const statusLabel = {em_producao:'Em produção', produzido:'Produzido', parada:'Parada'};

  function buildRow(r){
    const duracaoMin = calcularDuracaoMin(r.data, r.hora_inicio, r.hora_fim);
    return {
      'Data': fmtDate(r.data),
      'Hora início': r.hora_inicio,
      'Hora fim': r.hora_fim || '',
      'Duração': fmtDuracao(duracaoMin),
      'Status': statusLabel[r.status] || r.status,
      'Ordem de processo': r.ordem_processo || '',
      'Produto': r.produto || '',
      'Embalagem': r.embalagem || '',
      'Ensaque': r.ensaque || '',
      'Placa': r.placa || '',
      'Máquina': r.maquina_nome || '',
      'Turno': r.turno || '',
      'Operador': r.operador_nome || '',
      'Supervisor': r.supervisor_nome || '',
      'Volume produzido': r.volume_produzido || '',
      'Rejeito': r.rejeito || '',
      'Cód. parada': r.cod_parada || '',
      'Observação': r.observacao || ''
    };
  }

  const colWidths = [{wch:12},{wch:11},{wch:11},{wch:10},{wch:14},{wch:18},{wch:25},{wch:12},{wch:12},{wch:12},{wch:12},{wch:8},{wch:20},{wch:20},{wch:16},{wch:12},{wch:14},{wch:30}];

  function addSheet(name, subset){
    const data = subset.map(buildRow);
    const ws = XLSX.utils.json_to_sheet(data.length ? data : [{'Sem registros':''}]);
    ws['!cols'] = colWidths;
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31)); // Excel limita 31 chars
  }

  // Filtra apenas do dia atual ou com hora_fim no dia atual
  const hoje = new Date().toISOString().split('T')[0];
  const doDia = rows.filter(r => r.data === hoje || (r.hora_fim && r.data === hoje));

  // Aba Geral
  addSheet('Geral', doDia);

  // Abas por ensacadeira
  const ensaques = [...new Set(doDia.map(r => r.ensaque).filter(Boolean))].sort();
  ensaques.forEach(ens => {
    addSheet(ens, doDia.filter(r => r.ensaque === ens));
  });

  XLSX.writeFile(wb, `producao_${hoje}.xlsx`);
}

/* Dispara tudo: verifica sessao salva e mostra login ou plataforma */
init();
</script>
